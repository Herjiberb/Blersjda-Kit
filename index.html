        return new Promise((resolve) => {

const saveUsedPrompts = async (promptsArray) => {
    try {
        const db = await initDB();
        const tx = db.transaction(PROMPT_STORE, 'readwrite');
        const store = tx.objectStore(PROMPT_STORE);
        store.put({ id: Date.now(), prompts: promptsArray });
        const allReq = store.getAll();
        allReq.onsuccess = () => {
            const all = allReq.result.sort((a, b) => b.id - a.id);
            if (all.length > 30) {
                const toDelete = all.slice(30);
                toDelete.forEach(item => {
                    store.delete(item.id);
                });
            }
        };
    }
    catch (e) {
        console.error("Failed to save prompt history:", e);
    }
};
const getRecentUsedPrompts = async () => {
    try {
        const db = await initDB();
        return new Promise((resolve) => {
            const req = db.transaction(PROMPT_STORE, 'readonly').objectStore(PROMPT_STORE).getAll();
            req.onsuccess = () => {
                const all = req.result;
                const used = new Set();
                all.forEach(game => game.prompts.forEach(p => used.add(p)));
                resolve(Array.from(used));
            };
        });
    }
    catch (e) {
        console.error("Failed to load prompt history:", e);
        return [];
